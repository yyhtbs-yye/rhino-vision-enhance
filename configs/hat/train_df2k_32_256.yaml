_import: configs/base_image_config.yaml


boat:
  path: 'rhopsr.boats.base_restoration_boat'
  name: 'BaseRestorationBoat'

  models:
    net:
      path: 'rhopsr.nn.model_zoo.hat.hat_arch'
      name: 'HAT'
      params: 
        upscale: 4
        img_size: 64
        embed_dim: 96
        depths: [4, 4, 4, 6]
        num_heads: [6, 6, 6, 6]
        window_size: 8
        upsampler: 'pixelshuffle'
        load_pretrained: ~

  losses: 
    net:
      path: 'torch.nn'
      name: 'L1Loss'
      params: {}

visualization:
  save_images: true
  first_batch_only: true
  wnb: [1.0, 0.0]
  num_vis_samples: 4

_vars:

  max_epochs: 200

  norm_mean: [0.0, 0.0, 0.0]
  norm_std: [1.0, 1.0, 1.0]
  inflate_factor: 10

  devices: [0, 1, 2, 3]

  train_batch_size: 16
  valid_batch_size: 8
  num_workers: 32

  train_folder_paths:
    gt: data/DF2K/DF2K_train_HR
    lq: data/DF2K/DF2K_train_LR_bicubic/X4
    
  valid_folder_paths:
    gt: data/celeba/subsets/celeba_256
    lq: data/celeba/subsets/celeba_64

  experiment_name: hat_train_df2k_test_celeba_32_256

  ema_start: 0